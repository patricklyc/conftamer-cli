name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version="$(uv version --short)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            expected_tag="v${version}"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
              exit 1
            fi
            if [[ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]]; then
              echo "Release tag $GITHUB_REF_NAME must be annotated" >&2
              exit 1
            fi
          fi

  checks:
    name: Release checks (Python 3.13)
    runs-on: ubuntu-22.04
    env:
      UV_PYTHON: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Check formatting
        run: uvx ruff format --check src tests

      - name: Check types
        run: uvx ty check

      - name: Run tests
        run: uv run pytest -q

  build:
    name: Build ${{ matrix.artifact }}
    needs: [metadata, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x86_64
            executable: conftamer
            runner_arch: X64
          - os: macos-14
            artifact: macos-arm64
            executable: conftamer
            runner_arch: ARM64
          - os: windows-2022
            artifact: windows-x86_64
            executable: conftamer.exe
            runner_arch: X64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.13"
      RELEASE_NAME: conftamer-${{ needs.metadata.outputs.version }}-${{ matrix.artifact }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"

      - name: Install locked build dependencies
        run: uv sync --locked --no-dev --group build

      - name: Verify release architecture
        shell: bash
        run: |
          if [[ "$RUNNER_ARCH" != "${{ matrix.runner_arch }}" ]]; then
            echo "Expected ${{ matrix.runner_arch }}, got $RUNNER_ARCH" >&2
            exit 1
          fi

      - name: Build one-file executable
        shell: bash
        run: |
          uv run --no-sync pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name conftamer \
            --paths src \
            --exclude-module tkinter \
            src/conftamer/cli.py

      - name: Smoke-test packaged CLI
        shell: bash
        run: |
          executable="./dist/${{ matrix.executable }}"
          "$executable" --help
          "$executable" export --help

          mkdir -p smoke
          "$executable" export \
            examples/ctype/unmarshaler_subgraph.text \
            --output smoke/unmarshaler.graphml
          "$executable" export \
            examples/ctype/accessors.text \
            --output smoke/accessors.graphml

          uv run --no-sync python - <<'PY'
          import igraph as ig

          expected = {
              "smoke/unmarshaler.graphml": (57, 90),
              "smoke/accessors.graphml": (582, 822),
          }
          vertex_attributes = {
              "name",
              "label",
              "aliases",
              "methods",
              "tags",
              "names_json",
              "methods_json",
              "tags_json",
          }
          edge_attributes = {"ast_paths", "ast_paths_json"}
          for path, counts in expected.items():
              graph = ig.Graph.Read_GraphML(path)
              assert graph.is_directed()
              assert (graph.vcount(), graph.ecount()) == counts
              assert vertex_attributes <= set(graph.vertex_attributes())
              assert edge_attributes <= set(graph.edge_attributes())
          PY

      - name: Name release executable
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "dist/${{ matrix.executable }}" "${RELEASE_NAME}.exe"
          else
            cp "dist/${{ matrix.executable }}" "$RELEASE_NAME"
          fi

      - name: Upload executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conftamer-${{ matrix.artifact }}
          path: ${{ env.RELEASE_NAME }}*
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest release provenance
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download executables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: conftamer-*
          path: release
          merge-multiple: true

      - name: Attest executable provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/conftamer-*

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, build, attest]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download executables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: conftamer-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum conftamer-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --title "ConfTamer ${{ needs.metadata.outputs.version }}" \
              release/*
          fi
