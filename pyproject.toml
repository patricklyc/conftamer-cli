[project]
name = "conftamer"
version = "0.1.0"
description = "Validate gopls CType artifacts and export readable GraphML"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Patrick Lau", email = "patricklyc@berkeley.edu" }]
dependencies = [
  "igraph>=1.0.0",
  "pydantic>=2.13.4",
  "typer>=0.27.1",
]

[project.scripts]
conftamer = "conftamer.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
]
build = [
  "pyinstaller==6.22.2",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
